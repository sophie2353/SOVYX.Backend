<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación Lista de Espera V4 | SODIE</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hoja de estilos principal del proyecto -->
  <link rel="stylesheet" href="/styles.css">

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.75);
      --card-border: rgba(217, 70, 239, 0.15);
      --primary: #d946ef;
      --primary-hover: #c026d3;
      --secondary: #00ffcc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-glow: rgba(217, 70, 239, 0.2);
    }

    body.confirmation-body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 20% 20%, rgba(217, 70, 239, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(0, 255, 204, 0.1) 0px, transparent 50%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
    }

    .confirmation-container {
      width: 100%;
      max-width: 580px;
    }

    .card.confirmation-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: rgba(217, 70, 239, 0.12);
      color: #f472b6;
      border: 1px solid rgba(217, 70, 239, 0.3);
    }

    .conf-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .conf-body {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 24px 0;
    }

    .result-box-waitlist {
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0 28px 0;
      text-align: left;
    }

    .result-id-tag {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--secondary);
      letter-spacing: 0.05em;
      display: block;
      margin-top: 4px;
    }

    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-primary-glow {
      background: linear-gradient(135deg, var(--primary) 0%, #a21caf 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(217, 70, 239, 0.35);
    }

    .btn-primary-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(217, 70, 239, 0.5);
    }

    .loader-box {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 20px auto;
    }

    .d-none {
      display: none !important;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1754371812277932');
    fbq('track', 'PageView');
  </script>
</head>
<body class="confirmation-body">

  <div class="confirmation-container">
    <div class="card confirmation-card" id="main-card">
      <div class="status-badge" id="conf-badge">Lista de Espera V4 • SODIE</div>
      <h2 class="conf-title" id="conf-title">Procesando Confirmación...</h2>
      <p class="conf-body" id="conf-body">Verificando registro y asignando identificador prioritario...</p>
      
      <div id="loader-box" class="loader-box"></div>

      <!-- RESULTADO ASIGNADO POR EL BACKEND -->
      <div id="result-box" class="result-box-waitlist d-none">
        <span style="font-size: 0.85rem; color: #9ca3af; text-transform: uppercase; font-weight: 600;">Identificador Asignado:</span>
        <span id="generated-client-id" class="result-id-tag">CLIENT-V4-#</span>
        <p id="cupos-restantes-text" style="font-size: 0.88rem; color: #e5e7eb; margin: 12px 0 0 0;"></p>
      </div>

      <div class="action-grid">
        <button id="conf-action-btn" class="btn-action btn-primary-glow d-none">
          Ir a Firma de Contrato Digital (Waitlist) ➔
        </button>
      </div>
    </div>
  </div>

  <script src="confirm-waitlist.js"></script>
</body>
</html>
